<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài 1.13</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            font-size: 13px;
        }

        form {
            width: 320px;
            margin: 40px auto;
            border: 1px solid #777;
            padding: 8px;
        }

        h2 {
            margin: 0 0 8px;
            text-align: center;
            color: #3b6f91;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffcc;
        }

        td {
            border: 1px solid #96b89d;
            padding: 2px;
        }

        td:first-child {
            color: #176d7b;
            width: 70px;
        }

        input[type="text"] {
            height: 15px;
        }

        textarea {
            width: 220px;
            height: 35px;
        }

        fieldset {
            border: 1px solid #b25c35;
            color: #a5522b;
            text-align: center;
        }

        #thongBao {
            color: #e27c27;
            text-align: center;
        }
    </style>
</head>

<body>
    <form id="formDuLich">
        <h2>Đăng ký du lịch</h2>

        <table>
            <tr>
                <td>Họ và tên</td>
                <td>
                    <input type="text" id="hoTen" size="30"
                        value="Phạm Ngọc Cẩm Đào">
                </td>
            </tr>

            <tr>
                <td>Địa chỉ</td>
                <td>
                    <input type="text" id="diaChi" size="20"
                        value="227 Nguyễn Văn Cừ">
                </td>
            </tr>

            <tr>
                <td>Điện thoại</td>
                <td>
                    <input type="text" id="dienThoai" size="12"
                        value="8351056">
                </td>
            </tr>

            <tr>
                <td>Khách Việt Nam</td>
                <td>
                    <input type="checkbox" id="khachVietNam" checked>
                </td>
            </tr>

            <tr>
                <td>Chọn tour</td>
                <td>
                    <select id="chonTour">
                        <optgroup label="Miền Bắc">
                            <option>Hà Nội - Hạ Long - Sapa</option>
                            <option>Hà Nội - Chùa Hương - Ninh Bình</option>
                            <option>Hà Nội - Hải Phòng - Tuần Châu</option>
                        </optgroup>

                        <optgroup label="Miền Trung">
                            <option>Huế - Đà Nẵng</option>
                            <option>Huế - Bạch Mã - Đà Nẵng</option>
                            <option selected>Bốn miền - Gia Lai - Kontum</option>
                        </optgroup>

                        <optgroup label="Miền Nam">
                            <option>TP HCM - Mỹ Tho - Cần Thơ</option>
                            <option>TP HCM - Mũi Né</option>
                        </optgroup>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Phương tiện</td>
                <td>
                    <input type="radio" name="phuongTien" value="Máy bay">
                    Máy bay

                    <input type="radio" name="phuongTien" value="Xe ô tô" checked>
                    Xe ô tô
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <fieldset>
                        <legend>Số lượng đoàn khách</legend>

                        Người lớn
                        <input type="text" id="nguoiLon" size="3" value="6">

                        Trẻ em
                        <input type="text" id="treEm" size="3" value="4">
                    </fieldset>
                </td>
            </tr>

            <tr>
                <td>Ghi chú thêm</td>
                <td>
                    <textarea id="ghiChu">Có 2 trẻ em dưới 6 tuổi
Có 2 người ăn chay</textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="button" id="dongY" value="Đồng ý"
                        onclick="dangKy()">
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <div id="thongBao">Bạn đã đăng ký thành công!!!</div>
                </td>
            </tr>
        </table>
    </form>

    <script>
        function dangKy() {
            document.getElementById("thongBao").innerText =
                "Bạn đã đăng ký thành công!!!";
        }
    </script>
</body>
</html>
