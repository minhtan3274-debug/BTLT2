<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo form và các điều khiển</title>
    <style>
        form {
            width: 390px;
            margin: 25px auto;
        }

        h2 {
            margin: 0 0 12px;
            text-align: center;
            color: #a65a21;
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #c9eafa;
        }

        td {
            padding: 4px;
        }

        input[type="text"],
        input[type="password"] {
            width: 180px;
        }

        #ketQua {
            min-height: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <form id="formDangNhap">
        <h2>Đăng nhập</h2>

        <table border="1">
            <tr>
                <td>Mã người dùng:</td>
                <td>
                    <input type="text" id="maNguoiDung" value="ptnhung">
                </td>
            </tr>
            <tr>
                <td>Mật khẩu:</td>
                <td>
                    <input type="password" id="matKhau" value="12345678">
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="button" id="dongY" value="Đồng ý" onclick="xuatMaNguoiDung()">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div id="ketQua"></div>
                </td>
            </tr>
        </table>
    </form>

    <script>
        function xuatMaNguoiDung() {
            document.getElementById("ketQua").innerText =
                document.getElementById("maNguoiDung").value;
        }
    </script>
</body>
</html>
