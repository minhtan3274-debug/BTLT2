<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài 1.12</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
        }

        form {
            width: 700px;
            margin: 40px auto;
            padding: 15px;
            border: 2px solid #777;
        }

        h1 {
            margin-top: 5px;
            text-align: center;
            color: #316b13;
            font-size: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #dcf6d5;
            font-size: 18px;
        }

        td {
            border: 1px solid #31564d;
            padding: 5px;
        }

        td:first-child {
            width: 250px;
            color: #426e35;
        }

        input[type="text"] {
            font-size: 17px;
        }

        #thongBao {
            text-align: center;
            color: #e33b70;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <form id="formKhuyenMai">
        <h1>Phiếu đăng ký tham gia chương trình khuyến mãi</h1>

        <table>
            <tr>
                <td>Họ và tên</td>
                <td>
                    <input type="text" id="hoTen" size="35"
                        value="Nguyễn Ngọc Quỳnh Nga">
                </td>
            </tr>

            <tr>
                <td>Địa chỉ</td>
                <td>
                    <input type="text" id="diaChi" size="27"
                        value="2Bia Hùng Vương, Q10">
                </td>
            </tr>

            <tr>
                <td>Điện thoại</td>
                <td>
                    <input type="text" id="dienThoai" size="18"
                        value="0909097506">
                </td>
            </tr>

            <tr>
                <td>Phái</td>
                <td>
                    <input type="radio" name="phai" id="nam" value="Nam">
                    Nam

                    <input type="radio" name="phai" id="nu" value="Nữ" checked>
                    Nữ
                </td>
            </tr>

            <tr>
                <td>Nghề nghiệp</td>
                <td>
                    <select id="ngheNghiep">
                        <option>Bác sĩ</option>
                        <option>Kỹ sư</option>
                        <option selected>Giáo viên</option>
                        <option>Khác</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Chọn sản phẩm tham gia</td>
                <td>
                    <select id="sanPham" size="4" multiple>
                        <option selected>Kem đánh răng</option>
                        <option>Bột giặt</option>
                        <option selected>Dầu gội đầu</option>
                        <option>Sữa tắm</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Số người dự đoán tham gia</td>
                <td>
                    <input type="text" id="soNguoi" size="12" value="250000">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="button" id="dongY" value="Đồng ý"
                        onclick="dangKyKhuyenMai()">
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <div id="thongBao">Bạn đã đăng ký thành công!!!</div>
                </td>
            </tr>
        </table>
    </form>

    <script>
        function dangKyKhuyenMai() {
            document.getElementById("thongBao").innerText =
                "Bạn đã đăng ký thành công!!!";
        }
    </script>
</body>
</html>
